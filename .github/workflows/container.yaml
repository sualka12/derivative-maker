name: Derivative Maker CI

on:
  workflow_dispatch:
    inputs:
      build_method:
        description: "Select Build Method"
        required: true
        default: "developer"
        type: choice
        options:
          - "developer"
          - "official"

      # ========================================================================
      # DERIVATIVE-MAKER ONLY OPTIONS (Used when build_method is 'developer')
      # ========================================================================
      flavor:
        description: "[Developer] Target Flavor configuration"
        required: false
        default: "kicksecure-lxqt"
        type: choice
        options:
          - "kicksecure-lxqt"
          - "kicksecure-cli"
          - "whonix-gateway-lxqt"
          - "whonix-workstation-lxqt"
          - "whonix-gateway-cli"
          - "whonix-workstation-cli"

      # ========================================================================
      # DM-BUILD-OFFICIAL ONLY OPTIONS (Used when build_method is 'official')
      # ========================================================================
      flavors_list:
        description: "[Official] Space-separated Target Flavors Matrix"
        required: false
        default: "kicksecure-lxqt kicksecure-cli"
        type: string

      dist_build_multi_target_list:
        description: "[Official] Space-separated Output Targets Matrix"
        required: false
        default: "qcow2 raw"
        type: string

      dist_build_redistributable:
        description: "[Official] Enforce full release paradigm"
        required: false
        default: "true"
        type: string

      # ========================================================================
      # SHARED PARAMETERS (Used by both modes)
      # ========================================================================
      arch:
        description: "Target CPU Architecture"
        required: false
        default: "amd64"
        type: choice
        options:
          - "amd64"
          - "arm64"

      target:
        description: "Build Target output wrapper format"
        required: false
        default: "qcow2"
        type: choice
        options:
          - "qcow2"
          - "raw"
          - "ova"
          - "iso"

      type:
        description: "System Footprint Environment Type"
        required: false
        default: "vm"
        type: choice
        options:
          - "vm"
          - "container"
          - "base"
          - "host"

      freshness:
        description: "APT repository freshness profile"
        required: false
        default: "frozen"
        type: choice
        options:
          - "frozen"
          - "stable"
          - "testers"
          - "developers"

      container_engine:
        description: "Container Engine running the build process"
        required: true
        default: "podman"
        type: string

      allow_untagged:
        description: "Allow untagged"
        required: true
        default: false
        type: boolean

      allow_uncommitted:
        description: "Allow uncommitted"
        required: true
        default: false
        type: boolean

      allow_unfrozen:
        description: "Allow unfrozen sources"
        required: true
        default: false
        type: boolean

      version:
        description: "Release version code"
        required: false
        default: "18.2.4.3"
        type: string

      flavor_meta_packages_to_install:
        description: "Extra meta packages to install inside the container"
        required: false
        default: ""
        type: string

      install_package_list:
        description: "Individual specific packages to append"
        required: false
        default: ""
        type: string

      derivative_apt_repository_opts:
        description: "Custom APT repository option flags"
        required: false
        default: ""
        type: string

jobs:
  nested-vm-build:
    name: Execute Unified OS Build Workflow
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write

    env:
      # --- The Master Switch ---
      BUILD_METHOD: ${{ github.event.inputs.build_method }}

      # --- Developer Mode Parameter Map ---
      BUILD_FLAVOR: ${{ github.event.inputs.flavor }}
      BUILD_ARCH: ${{ github.event.inputs.arch }}
      BUILD_TARGET: ${{ github.event.inputs.target }}
      BUILD_TYPE: ${{ github.event.inputs.type }}
      BUILD_FRESHNESS: ${{ github.event.inputs.freshness }}

      # --- Official Mode Parameter Map ---
      flavors_list: ${{ github.event.inputs.flavors_list }}
      dist_build_target_arch: ${{ github.event.inputs.arch }}
      dist_build_multi_target_list: ${{ github.event.inputs.dist_build_multi_target_list }}
      dist_build_version_type: ${{ github.event.inputs.type }}
      dist_build_freshness: ${{ github.event.inputs.freshness }}
      dist_build_redistributable: ${{ github.event.inputs.dist_build_redistributable }}

      # --- Shared Configuration Parameters ---
      ENGINE: ${{ github.event.inputs.container_engine }}
      DERIVATIVE_APT_REPOSITORY_OPTS: ${{ github.event.inputs.derivative_apt_repository_opts }}
      CHOSEN_VERSION: ${{ github.event.inputs.version }}
      ALLOW_UNTAGGED: ${{ github.event.inputs.allow_untagged }}
      ALLOW_UNCOMMITTED: ${{ github.event.inputs.allow_uncommitted }}
      ALLOW_UNFROZEN: ${{ github.event.inputs.allow_unfrozen }}
      flavor_meta_packages: ${{ inputs.flavor_meta_packages_to_install }}
      install_package_list: ${{ inputs.install_package_list }}

    steps:
      - name: Checkout Repository Core and History
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Initialize and Clean Host Environment
        shell: bash
        run: |
          ./.github/scripts/setup-host.sh

      - name: Compile and Execute Guest OS Build
        shell: bash
        env:
          CI_PRIVATE_KEY: ${{ secrets.CI_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY_DIR: "/home/debian/.key_mnt"
          KEY_FILE: "/home/debian/.key_mnt/my-private-key.asc"
          GIT_URL: "https://github.com/tabletseeker/derivative-maker"
        run: |
          ./.github/scripts/build-guest.sh

      - name: Gather, Process, and Publish Release Artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/gather-artifacts.sh
